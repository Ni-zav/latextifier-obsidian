name: CI

on:
  push:
    branches: ["main", "build/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run check
      - name: Unit tests
        run: npm run test
      - name: Lint
        run: npm run lint
      - name: Production bundle
        run: npm run build
      - name: Verify plugin artifacts
        run: test -f main.js && test -f manifest.json && test -f styles.css
