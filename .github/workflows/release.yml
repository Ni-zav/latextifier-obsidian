name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate and build
        run: npm run ci
      - name: Package plugin
        run: |
          mkdir -p dist/latextifier
          cp main.js manifest.json styles.css dist/latextifier/
          cd dist
          zip -r "latextifier-${GITHUB_REF_NAME}.zip" latextifier
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             "dist/latextifier-${GITHUB_REF_NAME}.zip"             main.js manifest.json styles.css             --generate-notes             --title "Latextifier ${GITHUB_REF_NAME}"
